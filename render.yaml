# Render Blueprint — Goi Server (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: goi-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOI_UPLOADS_PATH
        value: /tmp/goi-uploads
      - key: GOI_DATA_DIR
        value: /tmp/goi-data
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Goi <onboarding@resend.dev>
      - key: WEB_APP_URL
        value: https://go-i.vercel.app
      - key: CONTACT_EMAIL
        sync: false
